name: Build and Deploy Container to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry (ACR)
        uses: azure/docker-login@v2
        with:
          login-server: lnreadersky788.azurecr.io
          username: lnreadersky788
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Docker Image
        run: |
          docker build -t lnreadersky788.azurecr.io/lnreader-backend:latest -t lnreadersky788.azurecr.io/lnreader-backend:${{ github.sha }} .
          docker push lnreadersky788.azurecr.io/lnreader-backend:latest
          docker push lnreadersky788.azurecr.io/lnreader-backend:${{ github.sha }}

      - name: Deploy Container to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: lnreader-sync-sky788
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          images: 'lnreadersky788.azurecr.io/lnreader-backend:${{ github.sha }}'
