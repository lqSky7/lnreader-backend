name: Backend CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lnreader
          POSTGRES_PASSWORD: lnreader_ci_pw
          POSTGRES_DB: lnreader_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U lnreader"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql://lnreader:lnreader_ci_pw@localhost:5432/lnreader_test
      BETTER_AUTH_SECRET: ci-secret-0123456789abcdef-ci-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3005
      CLIENT_ORIGIN: http://localhost:5173

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck (src + tests)
        run: npm run build

      - name: Run tests
        run: npm test
